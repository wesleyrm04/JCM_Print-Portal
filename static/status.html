<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My order status</title>
<meta name="description" content="Check the status of your print, repair or souvenir order.">
<meta name="theme-color" content="#2f5bea">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JCM Prints">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<header class="topbar"><div class="in">
  <a class="brand" href="/"><img src="/static/images/logo.jpg" alt="" width="34" height="34"><span data-shop-short>JCM Prints</span></a>
  <a class="btn ghost small" href="/status" data-i18n="nav.status">My order</a>
  <button class="langbtn" id="langBtn" type="button" aria-label="Language">FIL</button>
</div></header>
<main class="container stack">
  <section class="card stack">
    <h1 data-i18n="st.title">Check my order</h1>
    <form id="lookup" class="stack" novalidate>
      <div>
        <label for="oq" data-i18n="st.q">Order code or your name</label>
        <input id="oq" type="search" maxlength="60" autocomplete="off" autocapitalize="characters" enterkeyhint="search" data-i18n-ph="st.q_ph" placeholder="K7M2QX  or  Juan">
        <div class="small muted" style="margin-top:4px" data-i18n="st.q_hint">Type the 6-letter code from your receipt, or the name you used when you sent your order.</div>
      </div>
      <button class="btn block" type="submit" data-i18n="st.check">Check</button>
    </form>
    <div id="lookErr" class="alert bad hidden" role="alert"></div>
    <div id="recentBox" hidden><div class="small muted" data-i18n="st.recent">Orders made on this phone</div><div id="recentBtns" class="chips" style="margin-top:6px"></div></div>
  </section>

  <div id="resNote" class="alert info small hidden"></div>
  <div id="results" class="stack" aria-live="polite"></div>
</main>
<div class="footer"><span data-shop-name></span></div>
<script src="/static/js/common.js"></script>
<script src="/static/js/i18n.js"></script>
<script src="/static/js/status.js"></script>
</body>
</html>
